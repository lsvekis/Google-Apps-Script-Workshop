<!doctype html><html><body><form id="f"><input id="request" required placeholder="Request"><select id="category"><option>IT</option><option>Training</option><option>Other</option></select><button id="submit">Save</button></form><p id="status"></p><script>document.getElementById('f').onsubmit=e=>{e.preventDefault();const b=document.getElementById('submit'),s=document.getElementById('status');b.disabled=true;google.script.run.withSuccessHandler(v=>{s.textContent=v;b.disabled=false;e.target.reset()}).withFailureHandler(err=>{s.textContent=err.message;b.disabled=false}).addRequest(document.getElementById('request').value,document.getElementById('category').value)};</script></body></html>
